name: Boi Ech Cloudflare Preview CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: boi-ech
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: boi-ech/package-lock.json
      - run: npm ci
      - run: npm run validate:cloudflare-preview
      - run: npm run validate:release
      - run: npm run lint
      - run: npm test
