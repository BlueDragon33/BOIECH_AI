name: Boi Ech Cloudflare Preview Deploy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Gõ DEPLOY_PREVIEW để triển khai Bơi ếch vào môi trường preview riêng"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: boi-ech-cloudflare-preview
  cancel-in-progress: false

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: boi-ech-preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BOI_ECH_PREVIEW_D1_DATABASE_ID: ${{ secrets.BOI_ECH_PREVIEW_D1_DATABASE_ID }}
      BOI_ECH_PRODUCTION_D1_DATABASE_ID: ${{ secrets.BOI_ECH_PRODUCTION_D1_DATABASE_ID }}
      CONTROL_SERVICE_SECRET: ${{ secrets.CONTROL_SERVICE_SECRET }}
      APPLICATION_MANAGEMENT_PREVIEW_ORIGIN: ${{ vars.APPLICATION_MANAGEMENT_PREVIEW_ORIGIN }}
      BOI_ECH_PREVIEW_ORIGIN: ${{ vars.BOI_ECH_PREVIEW_ORIGIN }}
    steps:
      - name: Require explicit preview confirmation
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.confirm }}" != "DEPLOY_PREVIEW" ]]; then
            echo '::error::Deployment cancelled. Enter DEPLOY_PREVIEW exactly.'
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: boi-ech/package-lock.json

      - name: Require preview credentials and app secret
        shell: bash
        run: |
          set -euo pipefail
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID BOI_ECH_PREVIEW_D1_DATABASE_ID BOI_ECH_PRODUCTION_D1_DATABASE_ID CONTROL_SERVICE_SECRET; do
            if [[ -z "${!key:-}" ]]; then
              echo "::error::$key is required in the boi-ech-preview GitHub environment."
              exit 1
            fi
          done
          if [[ ${#CONTROL_SERVICE_SECRET} -lt 32 ]]; then
            echo '::error::CONTROL_SERVICE_SECRET must contain at least 32 characters.'
            exit 1
          fi

      - name: Install locked dependencies
        working-directory: boi-ech
        run: npm ci

      - name: Validate source before deployment
        working-directory: boi-ech
        run: |
          npm run validate:cloudflare-preview
          npm run lint
          npm test

      - name: Materialize isolated preview config
        working-directory: boi-ech
        run: npm run cloudflare:preview:prepare

      - name: Apply migrations to preview D1 only
        working-directory: boi-ech
        run: npx wrangler d1 migrations apply boi-ech-preview-db --remote --config wrangler.cloudflare.preview.jsonc

      - name: Build using Cloudflare preview bindings
        working-directory: boi-ech
        env:
          CLOUDFLARE_VITE_WRANGLER_CONFIG_PATH: wrangler.cloudflare.preview.jsonc
        run: npm run build

      - name: Verify generated deployment artifact
        working-directory: boi-ech
        run: npm run cloudflare:artifact:check

      - name: Deploy Bơi ếch preview Worker
        working-directory: boi-ech
        run: npx wrangler deploy

      - name: Install or rotate preview control secret
        working-directory: boi-ech
        shell: bash
        run: printf '%s' "$CONTROL_SERVICE_SECRET" | npx wrangler secret put CONTROL_SERVICE_SECRET --config wrangler.cloudflare.preview.jsonc

      - name: Smoke test configured preview origin
        if: ${{ env.BOI_ECH_PREVIEW_ORIGIN != '' }}
        shell: bash
        run: |
          set -euo pipefail
          case "$BOI_ECH_PREVIEW_ORIGIN" in
            https://*) ;;
            *) echo '::error::BOI_ECH_PREVIEW_ORIGIN must be HTTPS.'; exit 1 ;;
          esac
          if [[ "$BOI_ECH_PREVIEW_ORIGIN" == *.chatgpt.site ]]; then
            echo '::error::BOI_ECH_PREVIEW_ORIGIN must not point to ChatGPT Sites.'
            exit 1
          fi
          ROOT_CODE="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 15 "$BOI_ECH_PREVIEW_ORIGIN/")"
          case "$ROOT_CODE" in 200|301|302|303|307|308) ;; *) echo "Unexpected Bơi ếch root status: $ROOT_CODE"; exit 1 ;; esac

          curl --fail --silent --show-error --max-time 15 \
            -H "Authorization: Bearer $CONTROL_SERVICE_SECRET" \
            -H "x-control-actor: github-preview-smoke" \
            -H "x-control-role: owner" \
            "$BOI_ECH_PREVIEW_ORIGIN/api/control/status" > /tmp/boi-status.json
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const payload = JSON.parse(fs.readFileSync('/tmp/boi-status.json', 'utf8'));
          if (payload.application !== 'boi-ech') throw new Error('Bơi ếch preview status application mismatch.');
          if (payload?.deployment?.channel !== 'cloudflare-preview') throw new Error('Bơi ếch preview deployment channel mismatch.');
          if (!payload?.deployment?.paymentStorageReady) throw new Error('Bơi ếch preview R2 payment storage is not bound.');
          if (!payload?.deployment?.revision || payload.deployment.revision === 'unknown') throw new Error('Bơi ếch preview build revision is missing.');
          console.log('Bơi ếch preview status smoke PASS.');
          NODE

          curl --fail --silent --show-error --max-time 15 \
            -H "Authorization: Bearer $CONTROL_SERVICE_SECRET" \
            -H "x-control-actor: github-preview-smoke" \
            -H "x-control-role: owner" \
            "$BOI_ECH_PREVIEW_ORIGIN/api/control/overview?activityDays=0" > /tmp/boi-overview.json
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const payload = JSON.parse(fs.readFileSync('/tmp/boi-overview.json', 'utf8'));
          if (payload?.application?.id !== 'boi-ech') throw new Error('Bơi ếch preview control overview mismatch.');
          if (!Array.isArray(payload.devices)) throw new Error('Bơi ếch preview devices registry unavailable.');
          console.log('Bơi ếch preview registry smoke PASS.');
          NODE

      - name: Deployment boundary summary
        shell: bash
        run: |
          echo 'Bơi ếch preview deployment completed.'
          echo 'Worker: boi-ech-preview'
          echo 'D1: boi-ech-preview-db'
          echo 'R2: boi-ech-preview-payments'
          echo 'Production automatic deployment remains disabled.'
