name: Boi Ech Cloudflare Preview Deploy

on:
  push:
    branches: [ops/training-release-readiness-20261031]
  workflow_dispatch:
    inputs:
      confirm:
        description: "VERIFY_LOCAL_PREVIEW — built Worker and isolated local D1 acceptance"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: training-local-worker-acceptance
  cancel-in-progress: true

jobs:
  local-preview-acceptance:
    if: ${{ github.actor == 'BlueDragon33' && github.ref == 'refs/heads/ops/training-release-readiness-20261031' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.confirm == 'VERIFY_LOCAL_PREVIEW')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      BOI_ECH_ACCESS_MODE: managed
      LOCAL_CONTROL_PLANE: "true"
      APPLICATION_MANAGEMENT_ORIGIN: http://127.0.0.1:4173
      WRANGLER_SEND_METRICS: "false"
      TZ: Europe/Moscow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
      - name: Install locked application dependencies
        working-directory: boi-ech
        run: npm ci --no-audit --no-fund
      - name: Create ephemeral loopback-only test fixture
        working-directory: boi-ech
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          const value=crypto.randomBytes(32).toString('base64url');
          console.log('::add-mask::'+value);
          fs.appendFileSync(process.env.GITHUB_ENV,'CONTROL_SERVICE_SECRET='+value+'\n');
          NODE
      - name: Build verified Worker and run all application regressions
        working-directory: boi-ech
        run: npm test
      - name: Apply migrations to isolated local D1 only
        working-directory: boi-ech
        run: npx wrangler d1 migrations apply boi-ech-local --local --config wrangler.local.jsonc --persist-to .training-qa-state
      - name: Install pinned browser QA runtime
        working-directory: boi-ech
        run: |
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Verify actual rendered registration and manager workflows
        working-directory: boi-ech
        run: node scripts/verify-training-manager-browser.mjs
      - name: Save sanitized local preview evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: training-manager-local-worker-acceptance
          path: |
            boi-ech/qa-artifacts/*.png
            boi-ech/qa-artifacts/*report.json
          if-no-files-found: ignore
          retention-days: 7
