name: Boi Ech Cloudflare Preview Deploy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DEPLOY_PREVIEW to deploy the isolated Preview"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: boi-ech-cloudflare-preview
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    environment: boi-ech-preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CONTROL_SERVICE_SECRET: ${{ secrets.CONTROL_SERVICE_SECRET }}
      BOI_ECH_PREVIEW_D1_DATABASE_ID: ${{ secrets.BOI_ECH_PREVIEW_D1_DATABASE_ID }}
      BOI_ECH_PRODUCTION_D1_DATABASE_ID: ${{ secrets.BOI_ECH_PRODUCTION_D1_DATABASE_ID }}
      APPLICATION_MANAGEMENT_PREVIEW_ORIGIN: ${{ vars.APPLICATION_MANAGEMENT_PREVIEW_ORIGIN }}
      BOI_ECH_PREVIEW_ORIGIN: ${{ vars.BOI_ECH_PREVIEW_ORIGIN }}

    steps:
      - name: Require explicit preview confirmation
        shell: bash
        env:
          PREVIEW_CONFIRMATION: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          if [[ "$PREVIEW_CONFIRMATION" != "DEPLOY_PREVIEW" ]]; then
            echo '::error::Deployment cancelled. Enter DEPLOY_PREVIEW exactly.'
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"

      - name: Detect preview readiness
        id: config
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${CLOUDFLARE_API_TOKEN:-}" ]] || missing+=("CLOUDFLARE_API_TOKEN")
          [[ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]] || missing+=("CLOUDFLARE_ACCOUNT_ID")
          [[ -n "${BOI_ECH_PREVIEW_D1_DATABASE_ID:-}" ]] || missing+=("BOI_ECH_PREVIEW_D1_DATABASE_ID")
          [[ -n "${BOI_ECH_PRODUCTION_D1_DATABASE_ID:-}" ]] || missing+=("BOI_ECH_PRODUCTION_D1_DATABASE_ID")
          [[ -n "${CONTROL_SERVICE_SECRET:-}" ]] || missing+=("CONTROL_SERVICE_SECRET")
          [[ -n "${BOI_ECH_PREVIEW_ORIGIN:-}" ]] || missing+=("BOI_ECH_PREVIEW_ORIGIN")
          [[ -n "${APPLICATION_MANAGEMENT_PREVIEW_ORIGIN:-}" ]] || missing+=("APPLICATION_MANAGEMENT_PREVIEW_ORIGIN")
          if (( ${#missing[@]} )); then
            echo "::error::Protected Preview environment is incomplete: ${missing[*]}"
            exit 1
          fi
          if (( ${#CONTROL_SERVICE_SECRET} < 32 )); then
            echo "::error::CONTROL_SERVICE_SECRET must contain at least 32 characters (same value on both Preview Workers)."
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: steps.config.outputs.ready == 'true'
        working-directory: boi-ech
        run: npm ci --no-audit --no-fund

      - name: Package preview
        if: steps.config.outputs.ready == 'true'
        working-directory: boi-ech
        run: npm run cloudflare:preview:prepare

      - name: Build preview before any remote D1 mutation
        if: steps.config.outputs.ready == 'true'
        working-directory: boi-ech
        run: CLOUDFLARE_VITE_WRANGLER_CONFIG_PATH=wrangler.cloudflare.preview.jsonc npm run build

      - name: Verify generated Preview artifact before any remote D1 mutation
        if: steps.config.outputs.ready == 'true'
        working-directory: boi-ech
        run: npm run cloudflare:artifact:check

      - name: Apply isolated Preview migrations
        if: steps.config.outputs.ready == 'true'
        working-directory: boi-ech
        run: npx wrangler d1 migrations apply boi-ech-preview-db --remote --config wrangler.cloudflare.preview.jsonc

      - name: Deploy preview
        if: steps.config.outputs.ready == 'true'
        working-directory: boi-ech
        run: npx wrangler deploy

      - name: Install shared Owner bridge secret in Boi Ech Preview
        if: steps.config.outputs.ready == 'true'
        working-directory: boi-ech
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$CONTROL_SERVICE_SECRET" | npx wrangler secret put CONTROL_SERVICE_SECRET --config wrangler.cloudflare.preview.jsonc

      - name: Reconfirm exact verified Preview artifact after secret deployment
        if: steps.config.outputs.ready == 'true'
        working-directory: boi-ech
        run: |
          npm run cloudflare:artifact:check
          npx wrangler deploy

      - name: Quick availability check
        if: steps.config.outputs.ready == 'true' && env.BOI_ECH_PREVIEW_ORIGIN != ''
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..10}; do
            code="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 10 "$BOI_ECH_PREVIEW_ORIGIN/" || true)"
            case "$code" in 200|301|302|303|307|308|401|403) echo "Preview reachable: HTTP $code"; exit 0 ;; esac
            sleep 2
          done
          echo "::error::Preview URL did not answer after deployment; no acceptance."
          exit 1

      - name: Development publish summary
        if: always()
        run: |
          if [[ "${{ job.status }}" == "success" ]]; then
            echo "Isolated Preview deployment steps completed. Live Owner/MFA/3-device acceptance remains a separate gate."
          else
            echo "Preview deployment incomplete or failed; do NOT claim publication/acceptance."
          fi
