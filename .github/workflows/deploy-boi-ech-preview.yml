name: Boi Ech Cloudflare Preview Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: boi-ech-cloudflare-preview
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    environment: boi-ech-preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BOI_ECH_PREVIEW_D1_DATABASE_ID: ${{ secrets.BOI_ECH_PREVIEW_D1_DATABASE_ID }}
      BOI_ECH_PRODUCTION_D1_DATABASE_ID: ${{ secrets.BOI_ECH_PRODUCTION_D1_DATABASE_ID }}
      APPLICATION_MANAGEMENT_PREVIEW_ORIGIN: ${{ vars.APPLICATION_MANAGEMENT_PREVIEW_ORIGIN }}
      BOI_ECH_PREVIEW_ORIGIN: ${{ vars.BOI_ECH_PREVIEW_ORIGIN }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: boi-ech/package-lock.json

      - name: Require preview basics
        shell: bash
        run: |
          set -euo pipefail
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID BOI_ECH_PREVIEW_D1_DATABASE_ID BOI_ECH_PRODUCTION_D1_DATABASE_ID; do
            [[ -n "${!key:-}" ]] || { echo "::error::$key is required."; exit 1; }
          done

      - name: Install dependencies
        working-directory: boi-ech
        run: npm ci --no-audit --no-fund

      - name: Package preview
        working-directory: boi-ech
        run: npm run cloudflare:preview:prepare

      - name: Apply preview migrations
        working-directory: boi-ech
        run: npx wrangler d1 migrations apply boi-ech-preview-db --remote --config wrangler.cloudflare.preview.jsonc

      - name: Build preview
        working-directory: boi-ech
        env:
          CLOUDFLARE_VITE_WRANGLER_CONFIG_PATH: wrangler.cloudflare.preview.jsonc
        run: npm run build

      - name: Deploy preview
        working-directory: boi-ech
        run: npx wrangler deploy --config wrangler.cloudflare.preview.jsonc

      - name: Quick availability check
        if: ${{ env.BOI_ECH_PREVIEW_ORIGIN != '' }}
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..10}; do
            code="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 10 "$BOI_ECH_PREVIEW_ORIGIN/" || true)"
            case "$code" in 200|301|302|303|307|308|401|403) echo "Preview reachable: HTTP $code"; exit 0 ;; esac
            sleep 2
          done
          echo "::error::Preview did not become reachable."
          exit 1
