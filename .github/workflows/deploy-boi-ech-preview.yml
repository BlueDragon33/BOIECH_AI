name: Boi Ech Cloudflare Preview Deploy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DEPLOY_PREVIEW: publish BOTH isolated Preview Workers; Production is excluded"
        required: true
        type: string
      bridge_confirmation:
        description: "Type INSTALL_PREVIEW_BRIDGE: create/rotate the shared credential ONLY on the two Preview Workers"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: boi-ech-cloudflare-preview
  cancel-in-progress: false

jobs:
  deploy-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # One protected approval covers the exact two-Preview package, not Production.
    environment: boi-ech-preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BOI_ECH_PREVIEW_D1_DATABASE_NAME: ${{ vars.BOI_ECH_PREVIEW_D1_DATABASE_NAME }}
      BOI_ECH_PREVIEW_D1_DATABASE_ID: ${{ vars.BOI_ECH_PREVIEW_D1_DATABASE_ID || secrets.BOI_ECH_PREVIEW_D1_DATABASE_ID }}
      BOI_ECH_PRODUCTION_D1_DATABASE_ID: ${{ vars.BOI_ECH_PRODUCTION_D1_DATABASE_ID || secrets.BOI_ECH_PRODUCTION_D1_DATABASE_ID }}
      APPLICATION_MANAGEMENT_PREVIEW_D1_DATABASE_ID: ${{ vars.APPLICATION_MANAGEMENT_PREVIEW_D1_DATABASE_ID }}
      APPLICATION_MANAGEMENT_PRODUCTION_D1_DATABASE_ID: ${{ vars.APPLICATION_MANAGEMENT_PRODUCTION_D1_DATABASE_ID }}
      APPLICATION_MANAGEMENT_PREVIEW_ORIGIN: ${{ vars.APPLICATION_MANAGEMENT_PREVIEW_ORIGIN }}
      BOI_ECH_PREVIEW_ORIGIN: ${{ vars.BOI_ECH_PREVIEW_ORIGIN }}
      BOI_ECH_BASE_URL: ${{ vars.BOI_ECH_PREVIEW_ORIGIN }}
      CONTROL_OWNER_EMAILS: ${{ vars.CONTROL_OWNER_EMAILS }}
      APPLICATION_MANAGEMENT_ACCESS_MODE: standalone
      APPLICATION_MANAGEMENT_BUILD_REVISION: 80c400f6d4805b25fe21d2334afcbeaf3313f1b5
      PREVIEW_BRIDGE_CONFIRMATION: ${{ inputs.bridge_confirmation }}

    steps:
      - name: Require explicit preview confirmation
        shell: bash
        env:
          PREVIEW_CONFIRMATION: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          if [[ "$PREVIEW_CONFIRMATION" != "DEPLOY_PREVIEW" || "$PREVIEW_BRIDGE_CONFIRMATION" != "INSTALL_PREVIEW_BRIDGE" ]]; then
            echo '::error::Both exact Preview and Preview bridge confirmations are required.'
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: BlueDragon33/Application-Management
          ref: 80c400f6d4805b25fe21d2334afcbeaf3313f1b5
          path: application-management-preview-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"

      - name: Fail-closed paired Account-first V2 source contract (before Preview writes)
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const boi = fs.readFileSync("boi-ech/app/api/control/v2/account-summary/route.ts", "utf8");
          const app = fs.readFileSync("application-management-preview-source/app/api/apps/boi-ech/access/route.ts", "utf8");
          const view = fs.readFileSync("application-management-preview-source/app/boi-access-view.tsx", "utf8");
          const contract = 'boi-account-summary.v2';
          if (!boi.includes('contract: "' + contract + '"') ||
              !boi.includes('export async function GET(') ||
              !boi.includes('requireControlService(request)') ||
              boi.includes('export async function POST(') ||
              !app.includes('/api/control/v2/account-summary') ||
              !app.includes('result.payload.contract !== "' + contract + '"') ||
              !view.includes('data.contract === "' + contract + '"') ||
              !view.includes('data.verified !== true')) {
            throw new Error("Paired V2 source contract mismatch. STOP before D1 migration or Preview deployment.");
          }
          console.log("Paired BOIECH_AI x Application-Management V2 Preview source contract PASS (no remote writes).");
          NODE

      - name: Detect preview readiness
        id: config
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID BOI_ECH_PREVIEW_D1_DATABASE_NAME BOI_ECH_PREVIEW_D1_DATABASE_ID BOI_ECH_PRODUCTION_D1_DATABASE_ID APPLICATION_MANAGEMENT_PREVIEW_D1_DATABASE_ID APPLICATION_MANAGEMENT_PRODUCTION_D1_DATABASE_ID CONTROL_OWNER_EMAILS BOI_ECH_PREVIEW_ORIGIN APPLICATION_MANAGEMENT_PREVIEW_ORIGIN; do
            [[ -n "${!key:-}" ]] || missing+=("$key")
          done
          if (( ${#missing[@]} )); then
            echo "::error::Protected Preview environment is incomplete: ${missing[*]}"
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Install Boi dependencies
        working-directory: boi-ech
        run: npm ci --no-audit --no-fund
      - name: Boi regression gate
        working-directory: boi-ech
        run: npm test
      - name: Install App dependencies
        working-directory: application-management-preview-source
        run: npm ci --no-audit --no-fund
      - name: App regression gate
        working-directory: application-management-preview-source
        run: npm test

      - name: Package preview
        working-directory: boi-ech
        run: npm run cloudflare:preview:prepare
      - name: Package App Preview
        working-directory: application-management-preview-source
        env:
          GITHUB_SHA: 80c400f6d4805b25fe21d2334afcbeaf3313f1b5
        run: npm run cloudflare:preview:prepare

      - name: Confirm approved D1 identities and retained access protection without remote writes
        shell: bash
        run: |
          set -euo pipefail
          cd boi-ech
          npx --no-install wrangler d1 list --json --config wrangler.cloudflare.preview.jsonc > "$RUNNER_TEMP/boi-ech-preview-d1-list.json"
          node scripts/assert-preview-d1-inventory.mjs "$RUNNER_TEMP/boi-ech-preview-d1-list.json"
          node scripts/preview-stack-remote.mjs check
          cd ../application-management-preview-source
          node scripts/assert-preview-d1-inventory.mjs "$RUNNER_TEMP/boi-ech-preview-d1-list.json"

      - name: Build preview before any remote D1 mutation
        working-directory: boi-ech
        run: CLOUDFLARE_VITE_WRANGLER_CONFIG_PATH=wrangler.cloudflare.preview.jsonc npm run build
      - name: Build App Preview before any remote D1 mutation
        working-directory: application-management-preview-source
        run: CLOUDFLARE_VITE_WRANGLER_CONFIG_PATH=wrangler.cloudflare.jsonc npm run build
      - name: Verify generated Preview artifact before any remote D1 mutation
        working-directory: boi-ech
        run: npm run cloudflare:artifact:check
      - name: Verify generated App Preview artifact before any remote D1 mutation
        working-directory: application-management-preview-source
        run: npm run cloudflare:artifact:check

      - name: Apply isolated Preview migrations
        working-directory: boi-ech
        run: npx --no-install wrangler d1 migrations apply DB --remote --config wrangler.cloudflare.preview.jsonc
      - name: Apply isolated App Preview migrations
        working-directory: application-management-preview-source
        run: npx --no-install wrangler d1 migrations apply application-management-preview-db --remote --config wrangler.cloudflare.jsonc
      - name: Deploy preview
        working-directory: boi-ech
        run: npx --no-install wrangler deploy
      - name: Deploy App Preview retaining its existing encrypted access and vault secrets
        working-directory: application-management-preview-source
        run: npx --no-install wrangler deploy

      - name: Install shared Owner bridge only on the two exact Preview Workers and read back live revisions
        working-directory: boi-ech
        run: node scripts/preview-stack-remote.mjs install-bridge

      - name: Development publish summary
        if: always()
        shell: bash
        env:
          PREVIEW_JOB_STATUS: ${{ job.status }}
        run: |
          if [[ "$PREVIEW_JOB_STATUS" == "success" ]]; then
            echo "Both isolated Preview Workers deployed; live revision, D1 access and anonymous protection read back. Owner/MFA/3-device business acceptance remains separate."
          else
            echo "Preview deployment incomplete or failed; do NOT claim publication/acceptance. Production was excluded."
          fi
