name: Deploy Child Health Main to Cloudflare

on:
  push:
    branches:
      - main
    paths:
      - "suc-khoe-tre/**"
      - ".github/workflows/deploy-child-health.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-child-health-main-cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: suc-khoe-tre/package-lock.json
      - name: Install dependencies
        working-directory: suc-khoe-tre
        run: npm ci
      - name: Apply dedicated D1 migrations
        working-directory: suc-khoe-tre
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply suc-khoe-tre-db --remote --config wrangler.d1.jsonc
      - name: Build standalone Child Health application
        working-directory: suc-khoe-tre
        run: npx vite build
      - name: Deploy standalone Child Health Worker
        working-directory: suc-khoe-tre
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --name suc-khoe-tre
