name: Deploy Boi Ech Main to Cloudflare

on:
  push:
    branches:
      - main
    paths:
      - "boi-ech/**"
      - ".github/workflows/deploy-cloudflare.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-boi-ech-main-cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: boi-ech/package-lock.json

      - name: Install dependencies
        working-directory: boi-ech
        run: npm ci

      - name: Apply D1 migrations
        working-directory: boi-ech
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply boi-ech-db --remote --config wrangler.d1.jsonc

      - name: Build with Cloudflare Vite plugin
        working-directory: boi-ech
        run: npx vite build

      - name: Deploy to Cloudflare Workers
        working-directory: boi-ech
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
