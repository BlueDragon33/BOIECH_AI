name: Boi Ech Cloudflare Production Deploy (manual)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Gõ DEPLOY_PRODUCTION để triển khai Bơi ếch vào production hiện tại"
        required: true
        type: string
      activate_account_first:
        description: "Bật Account-first V2 theo phê duyệt của Owner; không tự duyệt hồ sơ cũ"
        required: true
        default: false
        type: boolean
      activate_single_review:
        description: "Bật quy trình duyệt một lần trên Account-first V2; không chạy lại ánh xạ hồ sơ cũ"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: deploy-boi-ech-production-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: boi-ech-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BOI_ECH_ACTIVATE_ACCOUNT_FIRST: ${{ inputs.activate_account_first }}
      BOI_ECH_ACTIVATE_SINGLE_REVIEW: ${{ inputs.activate_single_review }}
    steps:
      - name: Require explicit production confirmation
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.confirm }}" != "DEPLOY_PRODUCTION" ]]; then
            echo '::error::Deployment cancelled. Enter DEPLOY_PRODUCTION exactly.'
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: boi-ech/package-lock.json

      - name: Install dependencies
        working-directory: boi-ech
        run: npm ci

      - name: Validate and build before production deployment
        working-directory: boi-ech
        run: |
          npm run validate:release
          npm run lint
          npm test

      - name: Require Cloudflare production credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const account=String(process.env.CLOUDFLARE_ACCOUNT_ID??'').trim();
          if(account!=='f88a42260814230aa4a151abbfe5659d') throw new Error('Production Cloudflare account mismatch');
          fs.appendFileSync(process.env.GITHUB_ENV,`CLOUDFLARE_ACCOUNT_ID=${account}\n`);
          NODE

      - name: Package existing production Worker and preserve runtime policy
        id: package
        working-directory: boi-ech
        run: node scripts/production-package.mjs prepare

      - name: Build with Cloudflare Vite plugin
        working-directory: boi-ech
        env:
          BOI_ECH_LOCAL_DATABASE_ID: 7816425d-ce8a-4b3c-b303-7697fd4a529c
          BOI_ECH_ACCESS_MODE: managed
          CLOUDFLARE_VITE_WRANGLER_CONFIG_PATH: wrangler.cloudflare.production.jsonc
        run: npm run build

      - name: Verify production D1 binding in generated artifact
        working-directory: boi-ech
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/server/wrangler.json
          grep -q '7816425d-ce8a-4b3c-b303-7697fd4a529c' dist/server/wrangler.json
          if grep -q '00000000-0000-0000-0000-000000000004' dist/server/wrangler.json; then
            echo '::error::Generated production artifact still references the local D1 placeholder.'
            exit 1
          fi
          node scripts/production-package.mjs artifact
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const artifact = JSON.parse(fs.readFileSync('dist/server/wrangler.json', 'utf8'));
          if (artifact.vars?.BOI_ECH_ACCESS_MODE !== 'managed') throw new Error('Production device gate must be managed.');
          NODE

      - name: Capture D1 and Worker rollback points before any migration
        working-directory: boi-ech
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 time-travel info boi-ech-db --json --config wrangler.d1.jsonc > .sites-runtime/production-release/bookmark.json
          npx wrangler deployments list --name boi-ech --json --config wrangler.d1.jsonc > .sites-runtime/production-release/deployments.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {rollbackPoint} from './scripts/production-package.mjs';
          const bookmark=JSON.parse(fs.readFileSync('.sites-runtime/production-release/bookmark.json','utf8'));
          const deployments=JSON.parse(fs.readFileSync('.sites-runtime/production-release/deployments.json','utf8'));
          console.log(JSON.stringify(rollbackPoint(bookmark,deployments)));
          NODE

      - name: Apply production D1 migrations
        working-directory: boi-ech
        run: npx wrangler d1 migrations apply boi-ech-db --remote --config wrangler.d1.jsonc

      - name: Map existing profiles only when activating Account-first
        if: steps.package.outputs.map_legacy == 'true'
        working-directory: boi-ech
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute boi-ech-db --remote --config wrangler.d1.jsonc --json --command "SELECT (SELECT COUNT(*) FROM (SELECT person_code FROM device_access WHERE registration_submitted_at IS NOT NULL GROUP BY person_code HAVING COUNT(*)>1))+(SELECT COUNT(*) FROM (SELECT phone FROM device_access WHERE registration_submitted_at IS NOT NULL GROUP BY phone HAVING COUNT(*)>1))+(SELECT COUNT(*) FROM device_access d JOIN accounts a ON a.account_id='acc_'||d.device_id WHERE a.storage_device_id<>d.device_id) AS conflicts" > .sites-runtime/production-release/mapping-preflight.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const data=JSON.parse(fs.readFileSync('.sites-runtime/production-release/mapping-preflight.json','utf8'));
          if(data.length!==1||data[0].success!==true||data[0].results?.[0]?.conflicts!==0)throw new Error('Legacy mapping conflicts; activation stopped');
          NODE
          npx wrangler d1 execute boi-ech-db --remote --config wrangler.d1.jsonc --file scripts/account-first-legacy.sql > .sites-runtime/production-release/mapping-result.txt
          echo 'Legacy mappings prepared; original profiles, payments and approvals retained. No V2 account auto-approved.'

      - name: Deploy current Bơi ếch production Worker
        working-directory: boi-ech
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Read back the exact live production revision and retained binding
        working-directory: boi-ech
        run: node scripts/production-package.mjs readback

      - name: Verify live Production JavaScript and CSS assets
        # Public client assets must work before considering API-only smoke checks sufficient.
        working-directory: boi-ech
        run: node scripts/production-package.mjs assets

      - name: Verify Universal Management Contract on live Production
        shell: bash
        run: |
          set -euo pipefail
          READY=0
          for attempt in {1..12}; do
            CODE="$(curl --silent --show-error --output /tmp/boi-universal-contract.json --write-out '%{http_code}' --max-time 20               https://boi-ech.boiech-ai.workers.dev/api/application-management/contract || true)"
            if [[ "$CODE" == "200" ]]; then
              READY=1
              break
            fi
            if [[ "$CODE" != "404" && "$CODE" != "000" ]]; then
              echo "::error::Unexpected Universal Contract HTTP $CODE."
              cat /tmp/boi-universal-contract.json || true
              exit 1
            fi
            echo "Universal Contract route not ready yet (HTTP $CODE, attempt $attempt/12); waiting for Worker version propagation..."
            sleep 5
          done
          if [[ "$READY" != "1" ]]; then
            echo '::error::Universal Contract route did not become live within 60 seconds.'
            cat /tmp/boi-universal-contract.json || true
            exit 1
          fi
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const value = JSON.parse(fs.readFileSync('/tmp/boi-universal-contract.json', 'utf8'));
          if (value.schema !== 'application-management.contract/v1') throw new Error('Universal Contract schema mismatch.');
          if (value.application?.id !== 'boi-ech') throw new Error('Universal Contract application.id mismatch.');
          if (value.application?.category !== 'Học tập') throw new Error('Universal Contract category mismatch.');
          if (value.capabilities?.payments !== true || value.capabilities?.webLaunch !== true) throw new Error('Expected Bơi ếch capabilities are missing.');
          if (value.capabilities?.deviceApproval !== false || value.policy?.genericDeviceMutationAllowed !== false) {
            throw new Error('Bơi ếch generic mutation must remain fail-closed.');
          }
          console.log('Bơi ếch Universal Management Contract Production PASS.');
          NODE

      - name: Verify two new device identities on live Production
        if: steps.package.outputs.account_v2 != 'true'
        working-directory: boi-ech
        run: node scripts/verify-device-auth-live.mjs https://boi-ech.boiech-ai.workers.dev

      - name: Verify live Account-first V2 session and authorization boundary
        if: steps.package.outputs.account_v2 == 'true'
        working-directory: boi-ech
        env:
          BOI_ECH_EXPECT_SINGLE_REVIEW: ${{ steps.package.outputs.single_review }}
        run: node scripts/verify-account-first-live.mjs
