name: Deploy Learning Management Main to Cloudflare

on:
  push:
    branches:
      - main
    paths:
      - "quan-ly-hoc-tap/**"
      - ".github/workflows/deploy-control-center.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-learning-management-main-cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: quan-ly-hoc-tap/package-lock.json

      - name: Install dependencies
        working-directory: quan-ly-hoc-tap
        run: npm ci

      - name: Apply control-center D1 migrations
        working-directory: quan-ly-hoc-tap
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply learning-management-db --remote --config wrangler.d1.jsonc

      - name: Build control center
        working-directory: quan-ly-hoc-tap
        run: npx vite build

      - name: Deploy learning-management Worker
        working-directory: quan-ly-hoc-tap
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --name learning-management

      - name: Verify production auth configuration
        run: |
          set -euo pipefail
          ORIGIN="https://learning-management.boiech-ai.workers.dev"
          sleep 5

          STATUS="$(curl --fail --silent --show-error --retry 3 --retry-delay 2 "$ORIGIN/api/auth/status")"
          echo "$STATUS"
          node -e '
            const status = JSON.parse(process.argv[1]);
            if (!status.configured) throw new Error(`password config is not ready: ${JSON.stringify(status)}`);
            if (!status.sessionReady) throw new Error(`admin session is not ready: ${JSON.stringify(status)}`);
          ' "$STATUS"

          LOGIN_CODE="$(curl --silent --show-error --output /dev/null --write-out "%{http_code}" "$ORIGIN/login")"
          test "$LOGIN_CODE" = "200"

          ROOT_CODE="$(curl --silent --show-error --output /dev/null --write-out "%{http_code}" "$ORIGIN/")"
          case "$ROOT_CODE" in
            302|303|307|308) ;;
            *) echo "Unexpected anonymous root status: $ROOT_CODE"; exit 1 ;;
          esac

          WRONG_LOGIN_CODE="$(curl --silent --show-error --output /dev/null --write-out "%{http_code}" \
            --request POST \
            --header "content-type: application/x-www-form-urlencoded" \
            --data-urlencode "password=definitely-wrong-smoke-test-password" \
            "$ORIGIN/api/auth/login")"
          test "$WRONG_LOGIN_CODE" = "303"
