name: Boi Ech Production Deploy V29 Once

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: deploy-boi-ech-production-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.head_commit.message == 'Deploy production V29 once' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: boi-ech-production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: boi-ech/package-lock.json

      - name: Install dependencies
        working-directory: boi-ech
        run: npm ci

      - name: Validate and build before production deployment
        working-directory: boi-ech
        run: |
          npm run validate:release
          npm run lint
          npm test

      - name: Require Cloudflare production credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Apply production D1 migrations
        working-directory: boi-ech
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply boi-ech-db --remote --config wrangler.d1.jsonc

      - name: Build with Cloudflare Vite plugin
        working-directory: boi-ech
        run: npx vite build

      - name: Deploy current Bơi ếch production Worker
        working-directory: boi-ech
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
