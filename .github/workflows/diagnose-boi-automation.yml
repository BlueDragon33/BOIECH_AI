name: Diagnose Boi Automation Persistence

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: boi-ech-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"

      - name: Install Wrangler
        working-directory: boi-ech
        run: npm ci --no-audit --no-fund

      - name: Read device schema without personal records
        working-directory: boi-ech
        run: |
          set -euo pipefail
          npx wrangler d1 execute boi-ech-db --remote --config wrangler.d1.jsonc --json --command \
            "SELECT name, type, pk FROM pragma_table_info('device_access'); SELECT name, type FROM pragma_table_info('access_automation_settings'); SELECT name FROM sqlite_master WHERE type='index' AND tbl_name='device_access';"

      - name: Read current automation policy
        working-directory: boi-ech
        run: |
          set -euo pipefail
          npx wrangler d1 execute boi-ech-db --remote --config wrangler.d1.jsonc --json --command \
            "SELECT auto_confirm_new_devices, default_access_days, default_device_limit, updated_at FROM access_automation_settings WHERE id='global';"

      - name: Read aggregate device diagnostics
        working-directory: boi-ech
        run: |
          set -euo pipefail
          npx wrangler d1 execute boi-ech-db --remote --config wrangler.d1.jsonc --json --command \
            "SELECT COUNT(*) AS total_devices, SUM(CASE WHEN person_code='DEV-LOCAL' OR phone='0000000000' THEN 1 ELSE 0 END) AS standalone_identity_count, SUM(CASE WHEN registration_submitted_at IS NULL THEN 1 ELSE 0 END) AS unsubmitted_count FROM device_access; SELECT COUNT(*) AS policy_write_count, MAX(created_at) AS latest_policy_write_at FROM course_audit_log WHERE action='access_automation_updated';"

      - name: Read aggregate teacher access diagnostics
        working-directory: boi-ech
        run: |
          set -euo pipefail
          npx wrangler d1 execute boi-ech-db --remote --config wrangler.d1.jsonc --json --command \
            "SELECT COUNT(*) AS teacher_total, SUM(CASE WHEN status='approved' THEN 1 ELSE 0 END) AS approved_count, SUM(CASE WHEN status='pending' THEN 1 ELSE 0 END) AS pending_count, SUM(CASE WHEN status='blocked' THEN 1 ELSE 0 END) AS blocked_count, SUM(CASE WHEN access_expires_at IS NOT NULL AND datetime(access_expires_at)<=CURRENT_TIMESTAMP THEN 1 ELSE 0 END) AS expired_count, SUM(CASE WHEN registration_submitted_at IS NULL THEN 1 ELSE 0 END) AS unsubmitted_count, SUM(CASE WHEN COALESCE(trim(class_name),'')='' THEN 1 ELSE 0 END) AS missing_class_count FROM device_access WHERE person_role='teacher'; SELECT name FROM sqlite_master WHERE type='table' AND name IN ('course_activity_events','learner_self_assessments','course_content_versions');"

      - name: Read existing release and preview database identifiers
        working-directory: boi-ech
        run: |
          set -euo pipefail
          npx wrangler d1 list --config wrangler.d1.jsonc --json | node --input-type=module -e '
            let raw=""; for await(const part of process.stdin) raw+=part;
            const allowed=new Set(["boi-ech-db","boi-ech-preview-db","application-management-production-db","application-management-preview-db"]);
            const rows=JSON.parse(raw);
            if(!Array.isArray(rows)) throw new Error("Unexpected database inventory");
            console.log("RELEASE_DATABASE_INVENTORY="+JSON.stringify(rows.filter(row=>allowed.has(row.name)).map(row=>({name:row.name,uuid:row.uuid}))));
          '

      - name: Read Boi rollback bookmark
        working-directory: boi-ech
        run: npx wrangler d1 time-travel info boi-ech-db --json --config wrangler.d1.jsonc

      - name: Read Boi deployed Worker versions
        working-directory: boi-ech
        run: npx wrangler deployments list --name boi-ech --json --config wrangler.d1.jsonc
