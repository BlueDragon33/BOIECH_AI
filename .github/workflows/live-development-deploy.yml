name: Boi Ech Live Development Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: boi-ech-live-development
  cancel-in-progress: true

jobs:
  deploy_live:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    environment:
      name: boi-ech-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BOI_ECH_LOCAL_DATABASE_ID: 7816425d-ce8a-4b3c-b303-7697fd4a529c
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
      - name: Detect live readiness
        id: ready
        shell: bash
        run: |
          if [[ -n "${CLOUDFLARE_API_TOKEN:-}" && -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare credentials are missing; live publish skipped."
          fi
      - name: Install
        if: ${{ steps.ready.outputs.deploy == 'true' }}
        working-directory: boi-ech
        run: npm ci --no-audit --no-fund
      - name: Apply D1 migrations
        if: ${{ steps.ready.outputs.deploy == 'true' }}
        working-directory: boi-ech
        run: npx wrangler d1 migrations apply boi-ech-db --remote --config wrangler.d1.jsonc
      - name: Build
        if: ${{ steps.ready.outputs.deploy == 'true' }}
        working-directory: boi-ech
        run: npm run build
      - name: Deploy live
        if: ${{ steps.ready.outputs.deploy == 'true' }}
        working-directory: boi-ech
        run: npx wrangler deploy
      - name: Summary
        if: ${{ always() }}
        run: |
          echo "Boi Ech Standalone Development Mode"
          echo "main is the live development source"
