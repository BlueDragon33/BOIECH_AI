name: Patch Health capability negotiation

on:
  push:
    branches:
      - feature/health-control-capabilities
    paths:
      - .health-capability-negotiation-trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/health-control-capabilities
      - name: Apply capability negotiation patch
        run: python .github/scripts/patch-health-capability-negotiation.py
      - name: Commit runtime patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quan-ly-hoc-tap/app/health-control-center-v2.tsx
          git diff --cached --quiet || git commit -m "feat(admin): negotiate Health control capabilities"
          git push
