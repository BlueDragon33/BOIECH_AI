name: Patch Health device contract gate

on:
  push:
    branches:
      - fix/health-device-contract-gate
    paths:
      - .health-device-contract-gate-trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/health-device-contract-gate
          fetch-depth: 0
      - name: Apply compatibility gate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('quan-ly-hoc-tap/app/health-control-center-v2.tsx')
          t=p.read_text()
          def r(old,new):
              global t
              if old not in t:
                  raise SystemExit(f'pattern not found: {old[:100]!r}')
              t=t.replace(old,new,1)
          r('''  async function deviceAction(device: HealthDevice, action: string, extra: Record<string, unknown> = {}) {\n    setBusy(true); setError(""); setNotice("");''','''  async function deviceAction(device: HealthDevice, action: string, extra: Record<string, unknown> = {}) {\n    if (["set-device-type", "clear-device-type", "ack-environment"].includes(action) && (controlStatus?.contractVersion ?? 0) < 3) {\n      setError("Health_Care production chưa chạy Device Contract v3. Chức năng này sẽ tự mở sau khi backend Health được deploy.");\n      return;\n    }\n    setBusy(true); setError(""); setNotice("");''')
          r('''  const appBridge = bridgeForApplication(bootstrap);\n\n  return <main''','''  const appBridge = bridgeForApplication(bootstrap);\n  const deviceReviewSupported = (controlStatus?.contractVersion ?? 0) >= 3;\n\n  return <main''')
          r('''<strong>{counts.attention ? `${counts.attention} thiết bị cần kiểm tra` : `Ổn định · ${counts.overridden} chỉnh thủ công`}</strong>''','''<strong>{deviceReviewSupported ? (counts.attention ? `${counts.attention} thiết bị cần kiểm tra` : `Ổn định · ${counts.overridden} chỉnh thủ công`) : `Device Contract v${controlStatus?.contractVersion ?? "—"} · chờ Health v3`}</strong>''')
          old='''<div className={styles.labelRow}><select value={device.deviceTypeOverride ?? ""} disabled={busy || !canPublish(access.role)} onChange={(event) => { const next = event.target.value; void deviceAction(device, next ? "set-device-type" : "clear-device-type", next ? { deviceType: next } : {}); }}><option value="">Theo tự động ({deviceTypeLabels[device.detectedDeviceType]})</option><option value="desktop">Máy tính</option><option value="phone">Điện thoại</option><option value="tablet">Máy tính bảng / iPad</option></select>{device.environmentChanged ? <button type="button" disabled={busy || !canPublish(access.role)} onClick={() => void deviceAction(device, "ack-environment")}>Đã kiểm tra</button> : <span />}</div>'''
          new='''{deviceReviewSupported ? <div className={styles.labelRow}><select value={device.deviceTypeOverride ?? ""} disabled={busy || !canPublish(access.role)} onChange={(event) => { const next = event.target.value; void deviceAction(device, next ? "set-device-type" : "clear-device-type", next ? { deviceType: next } : {}); }}><option value="">Theo tự động ({deviceTypeLabels[device.detectedDeviceType]})</option><option value="desktop">Máy tính</option><option value="phone">Điện thoại</option><option value="tablet">Máy tính bảng / iPad</option></select>{device.environmentChanged ? <button type="button" disabled={busy || !canPublish(access.role)} onClick={() => void deviceAction(device, "ack-environment")}>Đã kiểm tra</button> : <span />}</div> : <small>Phân loại thủ công và xác nhận cảnh báo sẽ mở khi Health_Care production nâng lên Device Contract v3.</small>}'''
          r(old,new)
          p.write_text(t)
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add quan-ly-hoc-tap/app/health-control-center-v2.tsx
          git commit -m 'fix(admin): gate Health device v3 controls by contract'
          git push origin HEAD:fix/health-device-contract-gate
