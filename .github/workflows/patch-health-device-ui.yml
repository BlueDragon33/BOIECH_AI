name: Patch Health device classification UI

on:
  push:
    branches:
      - feature/health-device-classification-ui
    paths:
      - .health-device-ui-trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/health-device-classification-ui
          fetch-depth: 0
      - name: Apply UI patch
        run: python .github/scripts/patch-health-device-ui.py
      - name: Commit UI patch
        shell: bash
        run: |
          set -euo pipefail
          rm -f .health-device-ui-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(admin): show automatic Health device classification'
          git push origin HEAD:feature/health-device-classification-ui
