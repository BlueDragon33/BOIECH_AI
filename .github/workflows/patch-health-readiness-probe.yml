name: Patch Health readiness probe

on:
  push:
    branches:
      - feature/health-readiness-probe
    paths:
      - .health-readiness-probe-trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/health-readiness-probe
      - name: Apply readiness patch
        run: python .github/scripts/patch-health-readiness-probe.py
      - name: Commit runtime patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quan-ly-hoc-tap/app/admin-device-client.ts quan-ly-hoc-tap/app/api/center/route.ts quan-ly-hoc-tap/app/application-hub.tsx quan-ly-hoc-tap/app/center-admin.module.css
          git diff --cached --quiet || git commit -m "feat(admin): surface Health control readiness"
          git push
