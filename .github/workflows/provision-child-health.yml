name: Provision Child Health D1

on:
  push:
    branches:
      - staging/child-health-center-integration

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Wrangler
        run: npm install --global wrangler@4.92.0
      - name: Ensure dedicated D1 exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          LIST=$(wrangler d1 list --json)
          ID=$(node -e 'const rows=JSON.parse(process.argv[1]); const row=rows.find(x=>x.name==="suc-khoe-tre-db"); if(row) process.stdout.write(row.uuid || row.id || "")' "$LIST")
          if [ -z "$ID" ]; then
            OUT=$(wrangler d1 create suc-khoe-tre-db --json)
            echo "$OUT"
            ID=$(node -e 'const row=JSON.parse(process.argv[1]); process.stdout.write(row.uuid || row.id || row.database_id || "")' "$OUT")
          fi
          test -n "$ID"
          echo "CHILD_HEALTH_D1_ID=$ID"
