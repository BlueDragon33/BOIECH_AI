name: Provision Child Health D1

on:
  push:
    branches:
      - staging/child-health-center-integration

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Wrangler
        run: npm install --global wrangler@4.92.0
      - name: Ensure dedicated D1 exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          UUID_RE='[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}'
          LIST=$(wrangler d1 list 2>&1)
          printf '%s\n' "$LIST"
          ID=$(printf '%s\n' "$LIST" | grep -i 'suc-khoe-tre-db' | grep -Eo "$UUID_RE" | head -n1 || true)
          if [ -z "$ID" ]; then
            OUT=$(wrangler d1 create suc-khoe-tre-db 2>&1)
            printf '%s\n' "$OUT"
            ID=$(printf '%s\n' "$OUT" | grep -Eo "$UUID_RE" | head -n1 || true)
          fi
          test -n "$ID"
          echo "CHILD_HEALTH_D1_ID=$ID"
