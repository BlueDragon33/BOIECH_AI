name: Staging app admin isolation patch

on:
  push:
    branches:
      - staging/child-health-center-integration

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging/child-health-center-integration
          fetch-depth: 0
      - name: Isolate Boi Ech content queue and add regression coverage
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          route = Path('boi-ech/app/api/control/content/route.ts')
          text = route.read_text()
          text = text.replace('import { healthControlAction, healthControlDetail, healthVersionExists } from "../../../content-control-health.server";\n', '')

          text, count = re.subn(
              r'\nasync function combinedVersions\([\s\S]*?\n}\n\nexport async function GET',
              '\nexport async function GET',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('combinedVersions block not found exactly once')

          text = text.replace('const versions = await combinedVersions(database);', 'const versions = await listContentVersions(database);')

          get_health = '''    if (await healthVersionExists(versionId)) {\n      const detail = await healthControlDetail(versionId);\n      return respond({ ...detail, versions, application: "child-health" });\n    }\n\n'''
          if get_health not in text:
              raise SystemExit('GET health branch not found')
          text = text.replace(get_health, '', 1)

          post_health = '''    if (await healthVersionExists(versionId)) {\n      const result = await healthControlAction(actor, role, payload);\n      if (result.status >= 400) return respond(result.data, result.status);\n      return respond({ ...result.data, versions: await combinedVersions(database), application: "child-health" }, result.status);\n    }\n\n'''
          if post_health not in text:
              raise SystemExit('POST health branch not found')
          text = text.replace(post_health, '', 1)

          text = text.replace('versions: await combinedVersions(database)', 'versions: await listContentVersions(database)')
          if 'combinedVersions' in text or 'healthVersionExists' in text or 'healthControlAction' in text:
              raise SystemExit('mixed content queue references remain')
          route.write_text(text)

          tests = Path('boi-ech/tests/course-integrity.test.mjs')
          source = tests.read_text()
          marker = 'test("keeps child health and Boi Ech administration isolated", async () => {'
          if marker not in source:
              source += '''\n\ntest("keeps child health and Boi Ech administration isolated", async () => {\n  const boiControl = await readFile(new URL("../app/api/control/content/route.ts", import.meta.url), "utf8");\n  const healthControl = await readFile(new URL("../app/api/control/health-content/route.ts", import.meta.url), "utf8");\n  const healthServer = await readFile(new URL("../app/content-control-health.server.ts", import.meta.url), "utf8");\n\n  assert.doesNotMatch(boiControl, /healthControlAction|healthControlDetail|healthVersionExists|combinedVersions/);\n  assert.match(boiControl, /listContentVersions\\(database\\)/);\n  assert.match(healthControl, /healthControlDetail/);\n  assert.match(healthControl, /healthControlAction/);\n  assert.match(healthControl, /application: "child-health"/);\n  assert.match(healthServer, /health_content_versions/);\n});\n'''
          tests.write_text(source)
          PY
      - name: Commit isolated queues
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add boi-ech/app/api/control/content/route.ts boi-ech/tests/course-integrity.test.mjs
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "refactor: isolate application administration queues"
          git push origin HEAD:staging/child-health-center-integration
