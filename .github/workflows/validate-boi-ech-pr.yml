name: BOIECH_AI Development Fast CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: boiech-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
      - name: Fast repository sanity
        shell: bash
        run: |
          set -euo pipefail
          test -f boi-ech/package.json
          test -f boi-ech/vite.config.ts
          test -f boi-ech/scripts/prepare-cloudflare-preview.mjs
          node --check boi-ech/scripts/prepare-cloudflare-preview.mjs
          node --check boi-ech/scripts/validate-cloudflare-preview.mjs
          node -e "JSON.parse(require('fs').readFileSync('boi-ech/package.json','utf8'))"
