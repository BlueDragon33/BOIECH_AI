name: BOIECH_AI Validation CI

on:
  push:
    branches: [main, feat/boi-account-entitlement-108-20261108]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: boiech-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: boi-ech/package-lock.json
      - name: Fast repository sanity
        shell: bash
        run: |
          set -euo pipefail
          test -f boi-ech/package.json
          test -f boi-ech/vite.config.ts
          test -f boi-ech/scripts/prepare-cloudflare-preview.mjs
          node --check boi-ech/scripts/prepare-cloudflare-preview.mjs
          node --check boi-ech/scripts/validate-cloudflare-preview.mjs
          node -e "JSON.parse(require('fs').readFileSync('boi-ech/package.json','utf8'))"
      - name: Install locked dependencies
        working-directory: boi-ech
        timeout-minutes: 5
        run: npm ci --no-audit --no-fund
      - name: Audit release boundaries
        working-directory: boi-ech
        run: |
          npm run validate:release
          npm run validate:cloudflare-preview
      - name: Lint application
        working-directory: boi-ech
        timeout-minutes: 2
        run: npm run lint
      - name: Typecheck application
        working-directory: boi-ech
        timeout-minutes: 2
        run: npx --no-install tsc --noEmit --incremental false
      - name: Build verified artifact and run regressions
        working-directory: boi-ech
        timeout-minutes: 6
        run: npm test
      - name: Rehearse full D1 SQL migration sequence in isolated local Wrangler
        if: github.ref == 'refs/heads/feat/boi-account-entitlement-108-20261108'
        working-directory: boi-ech
        timeout-minutes: 5
        env:
          WRANGLER_SEND_METRICS: "false"
          CI: "true"
        shell: bash
        run: |
          set -euo pipefail
          # Local Miniflare D1 only: no account ID, API token, remote flag, paid resource or deployment.
          npx --no-install wrangler d1 migrations apply boi-ech-local --local --config wrangler.local.jsonc
          npx --no-install wrangler d1 execute boi-ech-local --local --config wrangler.local.jsonc --command "SELECT role,default_days FROM account_duration_policies ORDER BY role"
          npx --no-install wrangler d1 execute boi-ech-local --local --config wrangler.local.jsonc --command "SELECT account_id,expires_at,revision FROM account_entitlements LIMIT 1"
