name: Validate standalone Child Health staging

on:
  push:
    branches:
      - staging/child-health-center-integration

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: suc-khoe-tre/package-lock.json
      - name: Install dependencies
        working-directory: suc-khoe-tre
        run: npm ci
      - name: Build standalone application
        working-directory: suc-khoe-tre
        run: npx vite build
      - name: Apply dedicated D1 migration
        working-directory: suc-khoe-tre
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply suc-khoe-tre-db --remote --config wrangler.d1.jsonc
